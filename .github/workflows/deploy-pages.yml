# Publish the Vite production build to the gh-pages branch.
# Shareable preview: https://raw.githack.com/Baker532/watchmen-security-training/gh-pages/index.html
# GitHub Pages URL (after enabling Deploy from a branch): https://baker532.github.io/watchmen-security-training/
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/poc-placeholder-labels-fa27
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Publishes the built site to the gh-pages branch. This does not require
  # GitHub Pages to be enabled. GITHUB_TOKEN cannot create a Pages site.
  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          force-orphan: true
